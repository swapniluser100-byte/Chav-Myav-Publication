name = "chav-mayav-publication"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ---- Static site (public storefront + admin console) ----
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# ---- D1 database ----
# Create with: wrangler d1 create chav-mayav-db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "chav-mayav-db"
database_id = "b0d29f05-6d4a-48a0-9e84-f4654331c367"

# ---- Secrets (set with `wrangler secret put NAME`, never commit real values) ----
# ADMIN_SESSION_SECRET   (any long random string, used to sign admin login sessions)

[vars]
# Reserved for future use (no payment gateway or email service configured --
# checkout is Cash on Delivery, and orders are tracked in the admin console).
