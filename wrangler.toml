name = "chav-mayav-publication"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ---- Static site (public storefront + admin console) ----
[assets]
directory = "./public"
binding = "ASSETS"

# ---- D1 database ----
# Create with: wrangler d1 create chav-mayav-db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "chav-mayav-db"
database_id = "b0d29f05-6d4a-48a0-9e84-f4654331c367"

# ---- Secrets (set with `wrangler secret put NAME`, never commit real values) ----
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET
# RAZORPAY_WEBHOOK_SECRET
# RESEND_API_KEY
# ADMIN_SESSION_SECRET   (any long random string)

[vars]
EMAIL_FROM = "Chav Myav Publication <orders@chavmayav.com>"
EMAIL_REPLY_TO = "support@chavmayav.com"
ADMIN_ALERT_EMAIL = "owner@chavmayav.com"
