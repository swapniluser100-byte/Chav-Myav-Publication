<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>चेकआउट | चव म्याव प्रकाशन</title>
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/checkout.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="/html/index.html">
      <span class="brand-mark">चव म्याव प्रकाशन</span>
      <span class="brand-sub">CHAV MYAV PUBLICATION</span>
    </a>
    <nav class="main-nav">
      <a href="/html/index.html">मुखपृष्ठ</a>
      <a class="cart-link" href="/html/cart.html">🛒 कार्ट <span class="cart-count" data-cart-count>0</span></a>
    </nav>
  </div>
</header>

<div class="container">
  <h1 class="page-title">चेकआउट</h1>
  <div class="checkout-grid">
    <form id="checkout-form">
      <div class="form-group">
        <label for="name">पूर्ण नाव</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="email">ईमेल</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="phone">मोबाईल क्रमांक</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required />
        </div>
      </div>
      <div class="form-group">
        <label for="address1">पत्ता ओळ १</label>
        <input type="text" id="address1" name="address1" required />
      </div>
      <div class="form-group">
        <label for="address2">पत्ता ओळ २ (ऐच्छिक)</label>
        <input type="text" id="address2" name="address2" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="city">शहर</label>
          <input type="text" id="city" name="city" required />
        </div>
        <div class="form-group">
          <label for="state">राज्य</label>
          <input type="text" id="state" name="state" required value="महाराष्ट्र" />
        </div>
      </div>
      <div class="form-group">
        <label for="pincode">पिनकोड</label>
        <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" required />
      </div>
      <p class="form-error" id="checkout-error"></p>
      <button type="submit" class="btn btn-primary btn-block">पैसे भरा</button>
    </form>
    <div id="checkout-summary"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div><h4>चव म्याव प्रकाशन</h4><p>मराठी वाचकांसाठी दर्जेदार साहित्य घरपोच पोहोचवणारे प्रकाशन.</p></div>
    <div><h4>दुवे</h4><p><a href="/html/index.html">मुखपृष्ठ</a></p></div>
    <div><h4>संपर्क</h4><p>support@chavmayav.com</p></div>
  </div>
  <p class="footer-bottom">© 2026 चव म्याव प्रकाशन. सर्व हक्क राखीव.</p>
</footer>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart-store.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
