<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ॲडमिन लॉगिन | चव म्याव प्रकाशन</title>
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <h1>चव म्याव प्रकाशन</h1>
    <span class="brand-sub">ADMIN CONSOLE</span>
    <form id="login-form">
      <div class="form-group"><label>ईमेल</label><input type="email" name="email" required autofocus /></div>
      <div class="form-group"><label>पासवर्ड</label><input type="password" name="password" required /></div>
      <p class="form-error" id="login-error"></p>
      <button class="btn btn-primary" style="width:100%;" type="submit">लॉगिन करा</button>
    </form>
  </div>
</div>
<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/login.js"></script>
</body>
</html>
