<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Books | Admin Console</title>
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">
      <span class="brand-mark">Chav Myav Publication</span>
      <span class="brand-sub">ADMIN CONSOLE</span>
    </div>
    <nav>
      <a href="/admin/html/dashboard.html">Dashboard</a>
      <a href="/admin/html/books.html" class="active">Books</a>
      <a href="/admin/html/orders.html">Orders</a>
      <a href="/admin/html/customers.html">Customers</a>
    </nav>
    <button class="logout-btn" data-logout>Log Out</button>
  </aside>
  <main class="admin-main">
    <div class="admin-header">
      <h1>Books</h1>
      <button class="btn btn-primary" id="add-book-btn">+ New Book</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr><th>Title</th><th>Author</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="books-tbody">
        <tr><td colspan="7" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </main>
</div>
<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/books.js"></script>
</body>
</html>
