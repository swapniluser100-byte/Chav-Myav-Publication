<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ऑर्डर्स | ॲडमिन कन्सोल</title>
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">
      <span class="brand-mark">चव म्याव प्रकाशन</span>
      <span class="brand-sub">ADMIN CONSOLE</span>
    </div>
    <nav>
      <a href="/admin/html/dashboard.html">डॅशबोर्ड</a>
      <a href="/admin/html/books.html">पुस्तके</a>
      <a href="/admin/html/orders.html" class="active">ऑर्डर्स</a>
      <a href="/admin/html/customers.html">ग्राहक</a>
    </nav>
    <button class="logout-btn" data-logout>लॉगआउट</button>
  </aside>
  <main class="admin-main">
    <div class="admin-header">
      <h1>ऑर्डर्स</h1>
    </div>

    <div class="toolbar">
      <select id="status-filter">
        <option value="">सर्व स्थिती</option>
        <option value="pending_payment">पेमेंट प्रलंबित</option>
        <option value="paid">पेमेंट झाले</option>
        <option value="shipped">पाठवले</option>
        <option value="delivered">पोहोचले</option>
        <option value="cancelled">रद्द</option>
        <option value="payment_failed">पेमेंट अयशस्वी</option>
      </select>
    </div>

    <table class="admin-table">
      <thead>
        <tr><th>ऑर्डर</th><th>ग्राहक</th><th>स्थिती</th><th>रक्कम</th><th>दिनांक</th><th></th></tr>
      </thead>
      <tbody id="orders-tbody">
        <tr><td colspan="6" class="empty-state">लोड होत आहे...</td></tr>
      </tbody>
    </table>
  </main>
</div>
<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/orders.js"></script>
</body>
</html>
