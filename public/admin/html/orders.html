<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders | Admin Console</title>
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">
      <span class="brand-mark">Chav Myav Publication</span>
      <span class="brand-sub">ADMIN CONSOLE</span>
    </div>
    <nav>
      <a href="/admin/html/dashboard.html">Dashboard</a>
      <a href="/admin/html/books.html">Books</a>
      <a href="/admin/html/orders.html" class="active">Orders</a>
      <a href="/admin/html/customers.html">Customers</a>
    </nav>
    <button class="logout-btn" data-logout>Log Out</button>
  </aside>
  <main class="admin-main">
    <div class="admin-header">
      <h1>Orders</h1>
    </div>

    <div class="toolbar">
      <select id="status-filter">
        <option value="">All Statuses</option>
        <option value="pending_payment">Payment Pending</option>
        <option value="paid">Paid</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
        <option value="payment_failed">Payment Failed</option>
      </select>
    </div>

    <table class="admin-table">
      <thead>
        <tr><th>Order</th><th>Customer</th><th>Status</th><th>Amount</th><th>Date</th><th></th></tr>
      </thead>
      <tbody id="orders-tbody">
        <tr><td colspan="6" class="empty-state">Loading...</td></tr>
      </tbody>
    </table>
  </main>
</div>
<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/orders.js"></script>
</body>
</html>
