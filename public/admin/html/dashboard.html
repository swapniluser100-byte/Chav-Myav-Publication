<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | Admin Console</title>
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">
      <span class="brand-mark">Chav Myav Publication</span>
      <span class="brand-sub">ADMIN CONSOLE</span>
    </div>
    <nav>
      <a href="/admin/html/dashboard.html" class="active">Dashboard</a>
      <a href="/admin/html/books.html">Books</a>
      <a href="/admin/html/orders.html">Orders</a>
      <a href="/admin/html/customers.html">Customers</a>

    <div class="admin-header">
      <h1>Dashboard</h1>
      <span style="font-size:14px;color:var(--muted);">Welcome, <strong data-admin-name>...</strong></span>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="admin-header"><h1 style="font-size:18px;">Recent Orders</h1></div>
    <div id="recent-orders"></div>

    <div class="admin-header" style="margin-top:32px;"><h1 style="font-size:18px;">Recent Branded Emails</h1></div>
    <div id="recent-emails"></div>

</div>
<script src="/admin/js/admin-api.js"></script>
